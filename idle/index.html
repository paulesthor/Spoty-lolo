<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12140d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Big Odeur">
  <title>Big Odeur</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Rubik:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <div id="flies" aria-hidden="true"></div>
    <div class="hero">
      <div class="stinker" aria-hidden="true"><span class="waves"><i></i><i></i><i></i></span><span class="avatar" id="avatar"></span></div>
      <div class="nums">
        <div class="dust-line"><span id="dust">10</span><span class="unit">Relents</span><span id="rate" class="rate">0/s</span></div>
        <div id="smell" class="smell"></div>
        <div id="insult" class="insult"></div>
      </div>
    </div>
    <div id="chal-banner" class="banner hidden"></div>
    <div id="goal" class="goal hidden">
      <div class="goalbar"><div id="goal-fill" class="fill"></div><span id="goal-label" class="glabel"></span><span id="goal-pct" class="gpct">0 %</span></div>
    </div>
  </header>

  <main id="view"></main>

  <div id="pbar" class="hidden"></div>
  <nav id="tabs"></nav>

  <div id="toasts"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div id="modal-body"></div>
      <div id="modal-actions" class="row"></div>
    </div>
  </div>

  <script src="js/big.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
